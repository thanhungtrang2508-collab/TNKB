name: Đăng web app lên GitHub Pages

# Tự chạy mỗi khi app trong docs/ được cập nhật (sau lần quét hằng ngày),
# hoặc chạy tay. LƯU Ý: Pages chỉ hoạt động khi repo ở chế độ public
# (hoặc tài khoản có gói trả phí cho Pages private).
on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Cấu hình Pages (tự bật nếu chưa bật)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Đóng gói app
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
